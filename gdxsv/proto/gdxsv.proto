syntax = "proto3";

package proto;
option go_package = "gdxsv/proto";

message P2PMatchingReport {
  string battle_code = 1;
  int32 session_id = 2;
  int32 player_count = 3;
  int32 peer_id = 4;
  string close_reason = 5;
  int32 frame_count = 6;
  int32 disconnected_peer_id = 7;
  // repeated string logs = 10; // depreacated
  string after_log = 11;
  string before_log = 12;
  repeated float fps_history = 15;
  int32 total_timesync = 16;
  int32 input_block_count_0 = 17;
  int32 input_block_count_1 = 18;
  int32 input_block_count_2 = 19;
  repeated BattleLogRound round_data = 20;

  // Rollback timing of this peer. Times in microseconds.
  int32 input_delay = 21;
  RenderSettings render = 22;
  TimingStats socket_read_gap = 23; // between two reads of the rollback sockets
  int32 rollback_count = 24;
  repeated int32 rollback_depth_hist = 25; // [d]: rollbacks of d frames; the last bucket: d or more
  int32 rollback_max_us = 26;
  int32 late_frames_1 = 27; // Present intervals over 1 frame period
  int32 late_frames_1_5 = 28; // over 1.5 periods
  int32 late_frames_2 = 29; // over 2 periods
  int32 dropped_frames = 30;
  repeated RemotePeerReport remote_peers = 31;
  int32 relay_forwarded = 32; // packets this peer forwarded for other peers
  repeated int32 timesync_frames = 33; // frames where a timesync wait started, first ones only
  TimingStats input_read_interval = 34; // between local pad samples
  TimingStats input_send_interval = 35;
  TimingStats present_interval = 36;
  TimingStats rollback_frame_time = 40; // per rollback: its time / the frames it re-ran
  FrameTiming frame_timing = 41;
  // Present intervals by the deepest rollback since the previous Present, as rollback_depth_hist.
  repeated int32 present_depth_hist = 42;
  repeated int32 late_present_depth_hist = 43; // of those, over 1.5 periods: late_frames_1_5 by depth
  repeated int32 dropped_depth_hist = 44; // dropped_frames by depth
  // Presents with display statistics (DXGI frame statistics; DX11 only, 0 elsewhere).
  int32 display_stats_presents = 45;
  // Of those: vsyncs that repeated the last image because the next Present came late, by the deepest rollback
  // before that Present (buckets as rollback_depth_hist). Counts what was really shown; use it before
  // late_present_depth_hist, which misses lateness that a non-blocking Present hides.
  repeated int32 display_miss_depth_hist = 46;
  // Presents that DWM composed (windowed, not on top or not in independent flip): their statistics do not show
  // the repeated vsyncs, so they are left out of display_stats_presents and display_miss_depth_hist.
  int32 display_composed_presents = 47;
  reserved 37 to 39;
  reserved "rollback_budget", "budget_exhausted_frames", "budget_exhausted_depth_hist";
}

// Per emulation-thread frame: from a frame limiter wake to the next limiter wait (busy = the frame minus the
// limiter sleep). Times in microseconds. A wait is counted in the frames that had one: count = those frames.
message FrameTiming {
  int32 period_us = 1; // the limiter's frame period
  TimingStats work = 2; // busy - the waits below: emulation, rollback and render
  // Deprecated, sent by 1.10.2 only: busy includes present_wait, which is a vsync wait that the next frames
  // can absorb (DX11), so these count it as lost time. Read 1.10.2 data as: rollback_room is a lower bound
  // when present_wait.p50_us is large; over_period is not a display miss (use late_frames_1_5).
  TimingStats rollback_room = 3 [deprecated = true]; // period - (busy - rollback work)
  int32 over_period = 4 [deprecated = true]; // frames with busy > period
  repeated int32 over_period_depth_hist = 5 [deprecated = true]; // the deepest rollback of those frames
  TimingStats present_wait = 6; // threaded rendering off: time in Present (vsync, frame latency, GPU, driver)
  TimingStats render_wait = 7; // threaded rendering on: the render thread rendering this frame, after its last Present
  TimingStats rollback_wait = 8; // threaded rendering on: a rollback waiting for the render thread to release VRAM
  TimingStats queue_wait = 9; // threaded rendering on: a full render queue
  // How much of the Present wait later work absorbs, per mille: minus the slope of the next frame's
  // present_wait on this frame's rollback work (0: none, a GPU or swap wait; 1000: all, a vsync wait).
  int32 present_wait_elasticity = 10;
  // period - (busy - rollback work - present_wait * elasticity): the time a rollback could use. Uses the
  // elasticity measured so far in the session (0 before the first rollbacks).
  TimingStats rollback_slack = 11;
}

// Percentiles may be estimated from histogram buckets; count, mean, min, max and off_period are exact.
message TimingStats {
  int32 count = 1;
  int32 mean_us = 2;
  int32 min_us = 3;
  int32 p1_us = 4;
  int32 p5_us = 5;
  int32 p99_us = 6;
  int32 max_us = 7;
  int32 off_period = 8; // intervals outside +-2 ms of the frame period
  int32 p50_us = 9;
}

message RemotePeerReport {
  int32 peer_id = 1;
  int32 recv_loss = 2;
  int32 send_loss = 3;
  int32 ping_min_ms = 4;
  int32 ping_median_ms = 5;
  int32 ping_max_ms = 6;
  string route = 7; // "direct", "peer:<peer_id>" or "server:<region>"
}

message RenderSettings {
  bool threaded_rendering = 1;
  bool vsync = 2;
  int32 renderer = 3; // pvr.rend
}

message P2PMatching {
  string battle_code = 1;
  int32 session_id = 2;
  int32 player_count = 3;
  int32 peer_id = 4;
  // 5: deprecated
  int32 ping_test_duration = 6;
  bool is_training_game = 7;

  bytes rule_bin = 8;
  repeated BattleLogUser users = 9;
  repeated PlayerAddress candidates = 10;
  repeated RelayServer relays = 11;
  // Set for the one participant, nearest lbs, that streams its confirmed
  // inputs to lbs for live spectators. The others do not.
  bool spectator_uplink = 12;
}

message PlayerAddress {
  string user_id = 1;
  int32 peer_id = 2;
  string ip = 3;
  int32 port = 4;
  int32 team = 5;
}

// A relay the players may route their rollback packets through.
// The token admits them to this match's relay session, whose id is P2PMatching.session_id.
message RelayServer {
  string region = 1;
  string ip = 2;
  int32 port = 3;
  uint64 token = 4;
  string ip6 = 5; // empty when the relay has no IPv6 address
}

message GamePatch {
  string game_disk = 1;
  string name = 2;
  bool write_once = 4;
  repeated GamePatchCode codes = 10;
}

message GamePatchCode {
  int32 size = 1;
  uint32 address = 2;
  uint32 original = 3;
  uint32 changed = 4;
}

message GamePatchList {
  repeated GamePatch patches = 1;
}

message BattleLogUser {
  string user_id = 1;
  string user_name = 2;
  string pilot_name = 3;
  bytes game_param = 4;
  int32 battle_count = 5;
  int32 win_count = 6;
  int32 lose_count = 7;
  int32 grade = 8;
  int32 team = 9;
  string platform = 10;
  bytes user_name_sjis = 11;
  int32 pos = 12;
}

message BattleLogRound {
  int32 win_team = 1;
  repeated int32 used_ms = 2;
}

// Participants send confirmed inputs indexed by their own input count (their
// replay's indexes), NOT shared GGPO frames. These counts differ slightly
// between peers, so LBS records one participant, the first whose upload
// arrives, and drops the others' uploads after acknowledging them.
//
// Fields 5 onward are downlink-only (LBS -> spectator). Input, patch and
// round-state progress are acknowledged independently in SpectatorInputAck.
message SpectatorInputPush {
  string battle_code = 1;
  int32 session_id = 2;
  int32 start_frame = 3;
  repeated fixed64 inputs = 4;
  repeated int32 start_msg_indexes = 5;
  repeated uint64 start_msg_randoms = 6;
  repeated BattleLogRound round_data = 7;
  string close_reason = 8;
  int32 disconnect_user_index = 9;

  // Downlink-only, sent once to each new subscriber before any inputs. The
  // BattleLogFile with inputs, round state, patches and close fields stripped
  // out - disk, users and rule, which is what playback needs to start. It comes over UDP
  // rather than HTTP because LBS's HTTP port isn't publicly reachable.
  BattleLogFile header = 10;

  // Downlink-only: the lobby's game patches. The spectator must apply them to
  // stay deterministic, since the shared bootstrap savestate is generic.
  //
  // They are too big to ride with the header - ~1.4KB of a ~1.8KB header - so
  // they stream as their own datagram-sized chunks, resent from patch_ack the
  // way inputs resend from ack_frame. A fragmented datagram only arrives if
  // every fragment does, so splitting keeps delivery from degrading as the
  // patch table grows.
  repeated GamePatch patches = 11;
  int32 patch_start = 12;  // index of patches[0] within the full list
  int32 patch_total = 13;  // full list length, so the client knows when it has them all

  // Version of the complete round snapshot in fields 5-7; zero means no
  // snapshot in this push. Resent until the spectator applies it and ACKs.
  // On a close-only push, identifies the version required before stopping.
  int32 round_state_version = 14;
}

// Sent by LBS back to a streaming peer, or by a spectator back to LBS. The
// sender may discard buffered inputs strictly below ack_frame. For the
// recorded participant it is the log's contiguous length; for the others,
// everything they sent. For a spectator it is the canonical log position.
message SpectatorInputAck {
  string battle_code = 1;
  int32 ack_frame = 2;
  // How many patches the spectator has received contiguously; LBS resends
  // from here, so a lost chunk costs one chunk rather than the whole list.
  int32 patch_ack = 3;
  // Spectator -> LBS: latest round-state version actually applied to its log.
  int32 round_ack = 4;
  // LBS -> participant: individual accepted round starts (by frame) and
  // results (by round index). Explicit entries also acknowledge frame/index 0.
  repeated int32 round_event_ack = 5;
  repeated int32 round_result_ack = 6;
}

// Sent by a spectator client to LBS to start or resume receiving live
// SpectatorInputPush updates for battle_code from from_frame onward. Also
// doubles as a keepalive - LBS drops a subscriber that stops resending this
// (see spectatorSubscriberTimeout in lbs_spectator.go).
message SpectatorSubscribeRequest {
  string battle_code = 1;
  // 2 was session_id. Spectators are not battle participants and are not
  // given this value, so it is neither sent nor checked here.
  reserved 2;
  int32 from_frame = 3;
  // Echo the server's 16-byte cookie. Start with 16 zero bytes so a
  // challenge reply is no larger than the request that triggered it.
  bytes cookie = 4;
}

// Proves that a spectator receives packets at its observed UDP address
// before the server allocates a subscription. Expired cookies are renewed
// through the same exchange on the next subscribe/keepalive.
message SpectatorSubscribeChallenge {
  string battle_code = 1;
  bytes cookie = 2;
}

// Participants retry one round start at a time in order (mirrors
// GdxsvBackendRollback's start_msg_indexes/start_msg_randoms). frame is the
// sender's own input index; only the recorded participant's are used.
message SpectatorRoundEvent {
  string battle_code = 1;
  int32 session_id = 2;
  int32 frame = 3;
  uint64 random_value = 4;
}

// Retried until acknowledged when a round's result becomes known (win team / mobile suit used).
message SpectatorRoundResult {
  string battle_code = 1;
  int32 session_id = 2;
  int32 round_index = 3;
  BattleLogRound round = 4;
}

message BattleLogFile {
  string game_disk = 5;
  string gdxsv_version_deprecated = 2;
  string battle_code = 3;
  int32 log_file_version = 4;
  repeated GamePatch patches = 7;

  bytes rule_bin = 10;
  repeated BattleLogUser users = 11;
  repeated BattleMessage battle_data = 12;
  repeated fixed64 inputs = 15;
  repeated int32 start_msg_indexes = 16;
  repeated uint64 start_msg_randoms = 17;
  repeated BattleLogRound round_data = 18;

  int64 start_at = 20;
  int64 end_at = 21;
  string close_reason = 24;
  int32 disconnect_user_index = 25;
}

enum MessageType {
  None = 0;
  HelloServer = 1;
  Ping = 2;
  Pong = 3;
  Battle = 4;
  Fin = 5;
  HelloLbs = 10;
  SpectatorInputPushType = 20;
  SpectatorInputAckType = 21;
  SpectatorRoundEventType = 22;
  SpectatorRoundResultType = 23;
  SpectatorSubscribeType = 24;
  SpectatorSubscribeChallengeType = 25;
}

message BattleMessage {
  string user_id = 1;
  uint32 seq = 2;
  bytes body = 3;
}

message PingMessage {
  int64 timestamp = 1;
  string user_id = 2;
}

message PongMessage {
  int64 timestamp = 1;
  string user_id = 2;
  string public_addr = 3;
}

message HelloServerMessage {
  string session_id_deprecated = 1;
  bool ok = 2;
  string user_id = 3;
}

message FinMessage {
  string detail = 1;
}

message HelloLbsMessage {
  string user_id = 1;
}

message Packet {
  MessageType type = 1;
  uint32 seq = 2;
  uint32 ack = 3;
  string session_id = 5;

  HelloServerMessage hello_server_data = 10;
  PingMessage ping_data = 11;
  PongMessage pong_data = 12;
  repeated BattleMessage battle_data = 13;
  FinMessage fin_data = 14;
  HelloLbsMessage hello_lbs_data = 15;

  SpectatorInputPush spectator_input_push_data = 20;
  SpectatorInputAck spectator_input_ack_data = 21;
  SpectatorRoundEvent spectator_round_event_data = 22;
  SpectatorRoundResult spectator_round_result_data = 23;
  SpectatorSubscribeRequest spectator_subscribe_data = 24;
  SpectatorSubscribeChallenge spectator_subscribe_challenge_data = 25;
}
