syntax = "proto3";

package proto;
option go_package = "gdxsv/proto";

message P2PMatchingReport {
  string battle_code = 1;
  int32 session_id = 2;
  int32 player_count = 3;
  int32 peer_id = 4;
  string close_reason = 5;
  int32 frame_count = 6;
  int32 disconnected_peer_id = 7;
  // repeated string logs = 10; // depreacated
  string after_log = 11;
  string before_log = 12;
  repeated float fps_history = 15;
  int32 total_timesync = 16;
  int32 input_block_count_0 = 17;
  int32 input_block_count_1 = 18;
  int32 input_block_count_2 = 19;
  repeated BattleLogRound round_data = 20;
}

message P2PMatching {
  string battle_code = 1;
  int32 session_id = 2;
  int32 player_count = 3;
  int32 peer_id = 4;
  // 5: deprecated
  int32 ping_test_duration = 6;
  bool is_training_game = 7;

  bytes rule_bin = 8;
  repeated BattleLogUser users = 9;
  repeated PlayerAddress candidates = 10;
}

message PlayerAddress {
  string user_id = 1;
  int32 peer_id = 2;
  string ip = 3;
  int32 port = 4;
  int32 team = 5;
}

message GamePatch {
  string game_disk = 1;
  string name = 2;
  bool write_once = 4;
  repeated GamePatchCode codes = 10;
}

message GamePatchCode {
  int32 size = 1;
  uint32 address = 2;
  uint32 original = 3;
  uint32 changed = 4;
}

message GamePatchList {
  repeated GamePatch patches = 1;
}

message BattleLogUser {
  string user_id = 1;
  string user_name = 2;
  string pilot_name = 3;
  bytes game_param = 4;
  int32 battle_count = 5;
  int32 win_count = 6;
  int32 lose_count = 7;
  int32 grade = 8;
  int32 team = 9;
  string platform = 10;
  bytes user_name_sjis = 11;
  int32 pos = 12;
}

message BattleLogRound {
  int32 win_team = 1;
  repeated int32 used_ms = 2;
}

// Sent by a battle participant every confirmed frame. `inputs` carries every
// frame the sender thinks LBS hasn't acked yet, starting at start_frame, so a
// dropped packet delays a frame instead of losing it. All 4 participants send
// redundantly and LBS dedups by frame index.
//
// Fields 6-10 are downlink-only (LBS -> spectator) and always unset on the
// uplink. One message both ways means one reliability channel: a single
// SpectatorInputAck says "caught up on everything".
message SpectatorInputPush {
  string battle_code = 1;
  int32 session_id = 2;
  int32 peer_id = 3;
  int32 start_frame = 4;
  repeated fixed64 inputs = 5;
  repeated int32 start_msg_indexes = 6;
  repeated uint64 start_msg_randoms = 7;
  repeated BattleLogRound round_data = 8;
  string close_reason = 9;
  int32 disconnect_user_index = 10;

  // Downlink-only, sent once to each new subscriber before any inputs. The
  // BattleLogFile with inputs, round state and patches stripped out - disk,
  // users and rule, which is what playback needs to start. It comes over UDP
  // rather than HTTP because LBS's HTTP port isn't publicly reachable.
  BattleLogFile header = 11;

  // Downlink-only: the lobby's game patches. The spectator must apply them to
  // stay deterministic, since the shared bootstrap savestate is generic.
  //
  // They are too big to ride with the header - ~1.4KB of a ~1.8KB header - so
  // they stream as their own datagram-sized chunks, resent from patch_ack the
  // way inputs resend from ack_frame. A fragmented datagram only arrives if
  // every fragment does, so splitting keeps delivery from degrading as the
  // patch table grows.
  repeated GamePatch patches = 12;
  int32 patch_start = 13;  // index of patches[0] within the full list
  int32 patch_total = 14;  // full list length, so the client knows when it has them all
}

// Sent by LBS back to a streaming peer, or by a spectator back to LBS: the
// highest frame index the sender has received with no gaps before it. The
// other side may discard buffered/backlog data at or below this index.
message SpectatorInputAck {
  string battle_code = 1;
  int32 ack_frame = 2;
  // How many patches the spectator has received contiguously; LBS resends
  // from here, so a lost chunk costs one chunk rather than the whole list.
  int32 patch_ack = 3;
}

// Sent by a spectator client to LBS to start or resume receiving live
// SpectatorInputPush updates for battle_code from from_frame onward. Also
// doubles as a keepalive - LBS drops a subscriber that stops resending this
// (see spectatorSubscriberTimeout in lbs_spectator.go).
message SpectatorSubscribeRequest {
  string battle_code = 1;
  // 2 was session_id. Spectators are not battle participants and are not
  // given this value, so it is neither sent nor checked here.
  reserved 2;
  int32 from_frame = 3;
  // Echo the server's 16-byte cookie. Start with 16 zero bytes so a
  // challenge reply is no larger than the request that triggered it.
  bytes cookie = 4;
}

// Proves that a spectator receives packets at its observed UDP address
// before the server allocates a subscription. Expired cookies are renewed
// through the same exchange on the next subscribe/keepalive.
message SpectatorSubscribeChallenge {
  string battle_code = 1;
  bytes cookie = 2;
}

// Sent once per round start (mirrors GdxsvBackendRollback's
// start_msg_indexes/start_msg_randoms) so the live-assembled log stays
// deterministic across round boundaries.
message SpectatorRoundEvent {
  string battle_code = 1;
  int32 session_id = 2;
  int32 peer_id = 3;
  int32 frame = 4;
  uint64 random_value = 5;
}

// Sent when a round's result becomes known (win team / mobile suit used).
message SpectatorRoundResult {
  string battle_code = 1;
  int32 session_id = 2;
  int32 peer_id = 3;
  int32 round_index = 4;
  BattleLogRound round = 5;
}

message BattleLogFile {
  string game_disk = 5;
  string gdxsv_version_deprecated = 2;
  string battle_code = 3;
  int32 log_file_version = 4;
  repeated GamePatch patches = 7;

  bytes rule_bin = 10;
  repeated BattleLogUser users = 11;
  repeated BattleMessage battle_data = 12;
  repeated fixed64 inputs = 15;
  repeated int32 start_msg_indexes = 16;
  repeated uint64 start_msg_randoms = 17;
  repeated BattleLogRound round_data = 18;

  int64 start_at = 20;
  int64 end_at = 21;
  string close_reason = 24;
  int32 disconnect_user_index = 25;
}

enum MessageType {
  None = 0;
  HelloServer = 1;
  Ping = 2;
  Pong = 3;
  Battle = 4;
  Fin = 5;
  HelloLbs = 10;
  SpectatorInputPushType = 20;
  SpectatorInputAckType = 21;
  SpectatorRoundEventType = 22;
  SpectatorRoundResultType = 23;
  SpectatorSubscribeType = 24;
  SpectatorSubscribeChallengeType = 25;
}

message BattleMessage {
  string user_id = 1;
  uint32 seq = 2;
  bytes body = 3;
}

message PingMessage {
  int64 timestamp = 1;
  string user_id = 2;
}

message PongMessage {
  int64 timestamp = 1;
  string user_id = 2;
  string public_addr = 3;
}

message HelloServerMessage {
  string session_id_deprecated = 1;
  bool ok = 2;
  string user_id = 3;
}

message FinMessage {
  string detail = 1;
}

message HelloLbsMessage {
  string user_id = 1;
}

message Packet {
  MessageType type = 1;
  uint32 seq = 2;
  uint32 ack = 3;
  string session_id = 5;

  HelloServerMessage hello_server_data = 10;
  PingMessage ping_data = 11;
  PongMessage pong_data = 12;
  repeated BattleMessage battle_data = 13;
  FinMessage fin_data = 14;
  HelloLbsMessage hello_lbs_data = 15;

  SpectatorInputPush spectator_input_push_data = 20;
  SpectatorInputAck spectator_input_ack_data = 21;
  SpectatorRoundEvent spectator_round_event_data = 22;
  SpectatorRoundResult spectator_round_result_data = 23;
  SpectatorSubscribeRequest spectator_subscribe_data = 24;
  SpectatorSubscribeChallenge spectator_subscribe_challenge_data = 25;
}
